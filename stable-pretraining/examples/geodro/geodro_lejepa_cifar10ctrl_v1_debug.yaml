defaults:
  - geodro_lejepa_cifar10ctrl_base
  - _self_

metadata:
  method: geodro_v1_1
  run_role: v1_sanity

trainer:
  logger:
    name: ${metadata.method}-${metadata.dataset}-${metadata.model}-${metadata.run_role}
    group: ${metadata.method}/${metadata.dataset}/${metadata.model}/sanity

module:
  forward:
    _target_: stable_pretraining.geodro_lejepa.forward.geodro_lejepa_forward
    _partial_: true
  geodro_lejepa_loss:
    _target_: stable_pretraining.geodro_lejepa.CoherentHardnessGeoDROLeJEPALoss
    family: ${metadata.family}
    aggregation: ${metadata.aggregation}
    geometry_support: ${metadata.geometry_support}
    memory_usage_mode: ${metadata.memory_usage_mode}
    ssl_instantiation: ${metadata.ssl_instantiation}
    lambda_: 0.05
    num_slices: 64
    t_max: 3.0
    n_points: 9
    graph_feature_space: ${metadata.graph_feature_space}
    graph_feature_normalized: ${metadata.graph_feature_normalized}
    graph_distance_metric: ${metadata.graph_distance_metric}
    memory_stores_normalized_features: ${metadata.memory_stores_normalized_features}
    graph_mode: ${metadata.graph_mode}
    utility_mode: ${metadata.utility_mode}
    adversary_scope: ${metadata.adversary_scope}
    k: 4
    inner_steps: 3
    beta: 0.2
    tau_flow: 0.05
    alpha_max: 0.5
    warmup_fraction: 0.0
    ramp_fraction: 0.05
    ess_min_ratio: 0.25
