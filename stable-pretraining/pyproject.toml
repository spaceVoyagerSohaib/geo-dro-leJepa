[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-pretraining"
description = "Stable Pretraining Library for Self-Supervised Learning"
authors = []
license = {text = "MIT"}
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "torchmetrics",
    "lightning",
    "hydra-core",
    "omegaconf",
    "loguru",
    "tabulate",
    "pandas",
    "rich",
    "requests-cache",
    "prettytable",
    "submitit",
    "timm",
    "zstandard",
    "typer",
    "transformers",
    "pillow>=11.3.0",
    "wandb",
    "hydra-submitit-launcher",
    "matplotlib",
    "datasets",
    "psutil",
    "pyarrow==20.0.0",
    "scikit-learn>=1.7.0",
    "richuru",
    "lejepa",
]

dynamic = ["version"]

[project.scripts]
spt = "stable_pretraining.cli:app"

[project.entry-points."lightning.pytorch.callbacks_factory"]
stablepretraining_callbacks = "stable_pretraining.callbacks.factories:default"

[tool.setuptools.packages.find]
include = ["stable_pretraining*"]

[tool.setuptools_scm]
root = ".."
tag_regex = "^v(?P<version>.+)$"
fallback_version = "0.0.0"

[project.optional-dependencies]
# Development and documentation tools
dev = [
    "pytest",
    "coverage",
    "pytest-cov",
    "codecov",
    "pre-commit",
    "ruff",
    "sphinx",
    "sphinx-gallery",
    "sphinx-book-theme",
    "sphinxcontrib-bibtex",
    "matplotlib",
    "memory_profiler",
    "myst-parser",
]

# Evaluation-suite extras (see docs/eval_plan.md). `wilds` is needed only for
# the WILDS Camelyon17 dispatcher and the camelyon17 entry of the prewarm
# script; users not running that dataset can skip this extra.
eval = [
    "wilds",
    "pyyaml>=6.0",
]

# Optional dependency for the inherited Minari adapter integration test. Minari
# is not part of the SSL training runtime.
rl-test = [
    "minari[hdf5]>=0.5.3",
]


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D"]
ignore = ["D100", "D102", "D103", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
